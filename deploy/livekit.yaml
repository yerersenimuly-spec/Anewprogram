port: 7880
log_level: info
key_file: /etc/livekit/api-keys.yaml

room:
  auto_create: false

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

turn:
  enabled: true
  domain: turn.example.org
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/letsencrypt/live/turn.example.org/fullchain.pem
  key_file: /etc/letsencrypt/live/turn.example.org/privkey.pem
